    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1px;
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        .gallery-item {
            aspect-ratio: 1 / 1;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s;
        }
        .gallery-item:hover img {
            transform: scale(1.04);
        }
        .gallery-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .gallery-header h1 {
            font-size: 2.5rem;
            color: var(--color-primary);
        }
        .gallery-header a {
            color: var(--color-accent);
            text-decoration: none;
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
